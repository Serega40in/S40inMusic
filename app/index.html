<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#071126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="S40in Music — плеер лейбла. Слушай музыку, смотри клипы, сохраняй любимое.">
<meta property="og:title" content="S40in Music App">
<meta property="og:description" content="Музыка бесконечных миров прямо в кармане">
<meta property="og:image" content="https://serega40in.github.io/S40inMusic/photo_2026-10-31_21-44-50.jpg">
<title>S40in Music</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../photo_2026-10-31_21-44-50.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#050b19;
  --bg2:#08152b;
  --card:#0b1932;
  --gold:#f4d18a;
  --gold2:#fff0bd;
  --text:#f7f4ee;
  --muted:#a8b0c4;
  --line:#ffffff18;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Manrope,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  padding-top:var(--safe-t);
}
body:before{
  content:"";
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 10%,#123b6840,transparent 45%),
    radial-gradient(ellipse at 85% 60%,#58358b18,transparent 40%),
    linear-gradient(180deg,#061024,#030814 90%);
}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 8px;gap:12px;flex-shrink:0;
}
.logo{
  display:flex;align-items:center;gap:10px;
}
.logo img{
  width:42px;height:42px;border-radius:12px;object-fit:cover;
  border:1px solid #e7c98788;
  box-shadow:0 0 0 3px #071126aa;
}
.logo-text{
  font-family:"Cormorant Garamond",serif;
  font-size:20px;font-weight:600;letter-spacing:.04em;
}
.logo-text span{color:var(--gold);font-size:.75em;display:block;letter-spacing:.18em;margin-top:-2px}
.header-actions{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);
  background:#07132988;
  display:grid;place-items:center;
  transition:background .2s,transform .15s;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.6}

/* Tabs */
.tabs{
  display:flex;gap:4px;padding:0 16px 10px;flex-shrink:0;
}
.tab{
  flex:1;padding:10px 6px;border-radius:12px;
  font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--muted);text-align:center;
  transition:all .2s;
}
.tab.active{
  background:linear-gradient(135deg,#f4d18a22,#f4d18a08);
  color:var(--gold);
  border:1px solid #f4d18a44;
}

/* Content */
.content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:0 16px 180px;
  -webkit-overflow-scrolling:touch;
}
.section-title{
  font-family:"Cormorant Garamond",serif;
  font-size:22px;font-weight:500;color:var(--gold2);
  margin:18px 0 12px;
}

/* Track list */
.track{
  display:flex;align-items:center;gap:14px;
  padding:12px;border-radius:16px;margin-bottom:8px;
  background:linear-gradient(145deg,#0b1932cc,#060d1c99);
  border:1px solid var(--line);
  transition:border-color .2s,transform .15s;
  cursor:pointer;
}
.track:active{transform:scale(.985)}
.track.playing{
  border-color:#f4d18a66;
  background:linear-gradient(145deg,#122848,#0b1932);
  box-shadow:0 0 24px #f4d18a15;
}
.track-art{
  width:56px;height:56px;border-radius:12px;object-fit:cover;
  background:#0a1a30;flex-shrink:0;
  border:1px solid #e7c98733;
}
.track-info{flex:1;min-width:0}
.track-title{
  font-family:"Cormorant Garamond",serif;
  font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.track-artist{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.03em}
.track-actions{display:flex;gap:4px;flex-shrink:0}
.fav-btn,.play-mini{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
}
.fav-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7;transition:all .2s}
.fav-btn.active svg{stroke:var(--gold);fill:var(--gold)}
.play-mini svg{width:16px;height:16px;fill:var(--gold)}

/* Clips */
.clip-grid{display:grid;grid-template-columns:1fr;gap:12px}
.clip{
  position:relative;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:#0a1528;
  aspect-ratio:16/9;
}
.clip video,.clip img{width:100%;height:100%;object-fit:cover;display:block}
.clip-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,#050b19ee 0%,transparent 50%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
}
.clip-title{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:600}
.clip-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;
  background:#f4d18acc;color:#1a1208;
  display:grid;place-items:center;
  box-shadow:0 4px 20px #0008;
  transition:transform .2s;
}
.clip:active .clip-play{transform:translate(-50%,-50%) scale(.92)}
.clip-play svg{width:22px;height:22px;fill:currentColor;margin-left:2px}

/* Worlds / empty */
.empty{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.6
}
.empty a{color:var(--gold);text-decoration:underline}

/* Player bar */
.player{
  position:fixed;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,#0a1830f5,#050b19f8);
  border-top:1px solid #f4d18a33;
  backdrop-filter:blur(20px);
  padding:10px 16px calc(12px + var(--safe-b));
  z-index:50;
  transform:translateY(110%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.player.visible{transform:translateY(0)}
.progress-wrap{
  height:4px;background:#ffffff15;border-radius:99px;margin-bottom:10px;cursor:pointer;
  position:relative;
}
.progress-bar{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#f4d18a,#fff0bd);
  transition:width .1s linear;
}
.progress-wrap:active .progress-bar{transition:none}
.player-main{display:flex;align-items:center;gap:12px}
.player-art{
  width:48px;height:48px;border-radius:10px;object-fit:cover;
  border:1px solid #e7c98755;flex-shrink:0;
}
.player-meta{flex:1;min-width:0}
.player-title{
  font-family:"Cormorant Garamond",serif;
  font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-time{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.player-controls{display:flex;align-items:center;gap:6px}
.ctrl{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  transition:transform .15s,background .2s;
}
.ctrl:active{transform:scale(.9)}
.ctrl.play{
  width:48px;height:48px;
  background:linear-gradient(135deg,#fff1c7,#d6a653);
  color:#1a1208;
  box-shadow:0 4px 18px #e7b85b40;
}
.ctrl svg{width:20px;height:20px}
.ctrl.play svg{fill:currentColor;width:22px;height:22px}
.ctrl:not(.play) svg{stroke:var(--gold);fill:none;stroke-width:1.8}

/* Install banner */
.install-banner{
  position:fixed;left:16px;right:16px;bottom:calc(100px + var(--safe-b));
  background:linear-gradient(135deg,#122848,#0b1932);
  border:1px solid #f4d18a55;border-radius:16px;
  padding:14px 16px;display:none;align-items:center;gap:12px;
  z-index:40;box-shadow:0 12px 40px #0008;
  animation:slideUp .4s ease;
}
.install-banner.show{display:flex}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.install-banner p{flex:1;font-size:13px;line-height:1.4}
.install-banner strong{color:var(--gold)}
.install-btn{
  padding:10px 16px;border-radius:99px;font-size:12px;font-weight:800;
  background:linear-gradient(120deg,#fff1c7,#d6a653);color:#1a1208;
  white-space:nowrap;
}
.close-install{width:28px;height:28px;opacity:.6}

/* Toast */
.toast{
  position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%) translateY(-80px);
  background:#0b1932ee;border:1px solid #f4d18a44;color:var(--gold2);
  padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;
  z-index:100;transition:transform .35s;pointer-events:none;
  box-shadow:0 8px 30px #0006;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{
  width:32px;height:32px;border:2px solid #f4d18a33;border-top-color:var(--gold);
  border-radius:50%;margin:0 auto 16px;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="header">
  <a class="logo" href="../">
    <img src="../photo_2026-10-31_21-44-50.jpg" alt="S40in">
    <div class="logo-text">S40in<span>MUSIC</span></div>
  </a>
  <div class="header-actions">
    <button class="icon-btn" id="installBtn" title="На телефон" aria-label="Установить">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>
    </button>
    <a class="icon-btn" href="https://t.me/share/url?url=https%3A%2F%2Fserega40in.github.io%2FS40inMusic%2Fapp%2F&text=S40in%20Music%20App" target="_blank" rel="noopener" aria-label="Telegram">
      <svg viewBox="0 0 24 24" style="stroke:none;fill:var(--gold)"><path d="M21.8 3.4 18.5 20c-.25 1.18-.92 1.47-1.86.92l-5.14-3.79-2.48 2.39c-.27.27-.5.5-1.02.5l.37-5.24 9.53-8.61c.41-.36-.09-.56-.64-.2L5.48 13.42.4 11.83c-1.1-.35-1.12-1.1.23-1.63L20.5 2.62c.91-.34 1.7.22 1.3.78Z"/></svg>
    </a>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="music" role="tab">Музыка</button>
  <button class="tab" data-tab="clips" role="tab">Клипы</button>
  <button class="tab" data-tab="favs" role="tab">Любимое</button>
</nav>

<main class="content" id="content">
  <div id="tab-music">
    <div class="section-title">Слушать сейчас</div>
    <div id="trackList"></div>
    <div class="section-title" style="margin-top:28px">Ещё на Suno</div>
    <div id="sunoList"></div>
  </div>
  <div id="tab-clips" hidden>
    <div class="section-title">Клипы</div>
    <div class="clip-grid" id="clipList"></div>
  </div>
  <div id="tab-favs" hidden>
    <div class="section-title">Любимое</div>
    <div id="favList"></div>
  </div>
</main>

<!-- Mini player -->
<div class="player" id="player">
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="player-main">
    <img class="player-art" id="playerArt" src="../photo_2026-10-31_21-44-50.jpg" alt="">
    <div class="player-meta">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>
    </div>
    <div class="player-controls">
      <button class="ctrl" id="prevBtn" aria-label="Предыдущий">
        <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5"/></svg>
      </button>
      <button class="ctrl play" id="playBtn" aria-label="Играть">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl" id="nextBtn" aria-label="Следующий">
        <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="install-banner" id="installBanner">
  <p><strong>На телефон</strong><br>Добавь на экран «Домой» — будет как настоящее приложение</p>
  <button class="install-btn" id="doInstall">Установить</button>
  <button class="close-install" id="closeInstall" aria-label="Закрыть">✕</button>
</div>

<div class="toast" id="toast"></div>

<audio id="audio" preload="metadata"></audio>

<script>
const TRACKS = [
  {
    id: "zemlya",
    title: "Земля вспомнит небо",
    artist: "S40in",
    src: "../audio/%D0%B7%D0%B5%D0%BC%D0%BB%D1%8F%20%D0%B2%D1%81%D0%BF%D0%BE%D0%BC%D0%BD%D0%B8%D1%82%20%D0%BD%D0%B5%D0%B1%D0%BE.mp3",
    cover: "../assets/art/roots-of-lightning.svg",
    local: true
  },
  {
    id: "zemlya2",
    title: "Земля вспомнит небо (версия 2)",
    artist: "S40in",
    src: "../audio/%D0%B7%D0%B5%D0%BC%D0%BB%D1%8F%20%D0%B2%D1%81%D0%BF%D0%BE%D0%BC%D0%BD%D0%B8%D1%82%20%D0%BD%D0%B5%D0%B1%D0%BE%20(%D0%B2%D0%B5%D1%80%D1%81%D0%B8%D1%8F2).mp3",
    cover: "../assets/art/roots-of-lightning.svg",
    local: true
  },
  {
    id: "eira",
    title: "Эйра",
    artist: "S40in · Fantasy OST",
    src: "../audio/%D0%AD%D0%B9%D1%80%D0%B0.mp3",
    cover: "../assets/art/eira.svg",
    local: true
  },
  {
    id: "eira-pos",
    title: "Эйра · Position",
    artist: "S40in",
    src: "../audio/%D0%AD%D0%B9%D1%80%D0%B0%20Position.mp3",
    cover: "../assets/art/eira.svg",
    local: true
  },
  {
    id: "leni",
    title: "Лени",
    artist: "ЛКМ · Character Theme",
    src: "../audio/%D0%9B%D0%B5%D0%BD%D0%B8.mp3",
    cover: "../assets/art/lkm.svg",
    local: true
  },
  {
    id: "nataly",
    title: "I Always Love You",
    artist: "Nataly",
    src: "../audio/Nataly%20I%20Always%20Love%20you%20.mp3",
    cover: "../photo_2026-10-31_21-44-50.jpg",
    local: true
  }
];

const SUNO = [
  { title: "Музыка без границ", artist: "S40in · Studio", url: "https://suno.com/song/7aa106f6-baae-4cb7-9482-28b10bae9509" },
  { title: "Корни молнии", artist: "S40in", url: "https://suno.com/s/ENrqNrURS1imoMbK" },
  { title: "Мир в сотворчестве", artist: "QUN", url: "https://suno.com/s/0v55Dm7n6FYl1Aji" },
  { title: "Модуль за модулем", artist: "ЛКМ", url: "https://suno.com/song/3db8d32f-1598-4eac-83d6-098ce076c7c2" },
  { title: "Дом в гармонии", artist: "TFT Home", url: "https://suno.com/song/22868f10-a507-420a-bc8b-74543be39ca7" },
  { title: "Фрагмент первого мюзикла", artist: "Musical · Chapter I", url: "https://suno.com/s/QIDdinxgrMntJx0f" }
];

const CLIPS = [
  {
    title: "Сила жизни",
    src: "../assets/generated_video.mp4",
    poster: "../photo_2026-10-31_21-44-50.jpg"
  },
  {
    title: "Дом на сцене",
    src: "../assets/music_videomp4.mp4",
    poster: "../photo_2026-10-31_21-57-15.jpg"
  },
  {
    title: "Танец у живого дерева",
    src: "../assets/music_videomp4%20(1).mp4",
    poster: "../sitestyle.jpg"
  }
];

// State
let currentIndex = -1;
let isPlaying = false;
let favs = JSON.parse(localStorage.getItem("s40in_favs") || "[]");
const audio = document.getElementById("audio");
const playerEl = document.getElementById("player");
const progressBar = document.getElementById("progressBar");
const progressWrap = document.getElementById("progressWrap");

// Tabs
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    ["music","clips","favs"].forEach(id => {
      document.getElementById("tab-" + id).hidden = id !== tab.dataset.tab;
    });
    if (tab.dataset.tab === "favs") renderFavs();
  });
});

// Render tracks
function renderTracks() {
  const list = document.getElementById("trackList");
  list.innerHTML = TRACKS.map((t, i) => `
    <div class="track ${currentIndex === i && isPlaying ? "playing" : ""}" data-i="${i}">
      <img class="track-art" src="${t.cover}" alt="" loading="lazy" onerror="this.src='../photo_2026-10-31_21-44-50.jpg'">
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="track-actions">
        <button class="fav-btn ${favs.includes(t.id) ? "active" : ""}" data-id="${t.id}" aria-label="В любимое">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <button class="play-mini" data-i="${i}" aria-label="Играть">
          <svg viewBox="0 0 24 24"><path d="${currentIndex === i && isPlaying ? "M6 19h4V5H6v14zm8-14v14h4V5h-4z" : "M8 5v14l11-7z"}"/></svg>
        </button>
      </div>
    </div>
  `).join("");

  list.querySelectorAll(".track").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.closest(".fav-btn")) return;
      const i = +el.dataset.i;
      if (currentIndex === i) togglePlay();
      else playTrack(i);
    });
  });
  list.querySelectorAll(".fav-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      toggleFav(btn.dataset.id);
      btn.classList.toggle("active");
    });
  });
}

function renderSuno() {
  document.getElementById("sunoList").innerHTML = SUNO.map(s => `
    <a class="track" href="${s.url}" target="_blank" rel="noopener">
      <img class="track-art" src="../photo_2026-10-31_21-44-50.jpg" alt="">
      <div class="track-info">
        <div class="track-title">${s.title}</div>
        <div class="track-artist">${s.artist} · Suno ↗</div>
      </div>
    </a>
  `).join("");
}

function renderClips() {
  document.getElementById("clipList").innerHTML = CLIPS.map((c, i) => `
    <div class="clip" data-i="${i}">
      <img src="${c.poster}" alt="${c.title}" loading="lazy">
      <div class="clip-overlay">
        <div class="clip-title">${c.title}</div>
      </div>
      <div class="clip-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
  `).join("");
  document.querySelectorAll(".clip").forEach(el => {
    el.addEventListener("click", () => {
      const c = CLIPS[+el.dataset.i];
      const v = document.createElement("video");
      v.src = c.src;
      v.controls = true;
      v.autoplay = true;
      v.playsInline = true;
      v.style.cssText = "position:fixed;inset:0;width:100%;height:100%;z-index:200;background:#000;object-fit:contain";
      const close = document.createElement("button");
      close.textContent = "✕";
      close.style.cssText = "position:fixed;top:calc(16px + var(--safe-t));right:16px;z-index:201;width:40px;height:40px;border-radius:50%;background:#000a;color:#fff;font-size:18px;border:1px solid #fff3";
      close.onclick = () => { v.pause(); v.remove(); close.remove(); };
      document.body.append(v, close);
      v.addEventListener("ended", () => { v.remove(); close.remove(); });
    });
  });
}

function renderFavs() {
  const favTracks = TRACKS.filter(t => favs.includes(t.id));
  const el = document.getElementById("favList");
  if (!favTracks.length) {
    el.innerHTML = `<div class="empty">Пока пусто.<br>Нажми ♥ на треке, чтобы добавить.</div>`;
    return;
  }
  el.innerHTML = favTracks.map(t => {
    const i = TRACKS.findIndex(x => x.id === t.id);
    return `
    <div class="track ${currentIndex === i && isPlaying ? "playing" : ""}" data-i="${i}">
      <img class="track-art" src="${t.cover}" alt="" onerror="this.src='../photo_2026-10-31_21-44-50.jpg'">
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="track-actions">
        <button class="fav-btn active" data-id="${t.id}"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll(".track").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.closest(".fav-btn")) {
        toggleFav(e.target.closest(".fav-btn").dataset.id);
        renderFavs();
        renderTracks();
        return;
      }
      playTrack(+el.dataset.i);
    });
  });
}

function toggleFav(id) {
  if (favs.includes(id)) favs = favs.filter(x => x !== id);
  else favs.push(id);
  localStorage.setItem("s40in_favs", JSON.stringify(favs));
  toast(favs.includes(id) ? "Добавлено в любимое" : "Убрано из любимого");
}

// Player
function playTrack(i) {
  currentIndex = i;
  const t = TRACKS[i];
  audio.src = t.src;
  audio.play().then(() => {
    isPlaying = true;
    updatePlayerUI();
    renderTracks();
  }).catch(err => {
    toast("Не удалось воспроизвести");
    console.error(err);
  });
  playerEl.classList.add("visible");
  document.getElementById("playerTitle").textContent = t.title;
  document.getElementById("playerArt").src = t.cover;
}

function togglePlay() {
  if (currentIndex < 0) { playTrack(0); return; }
  if (audio.paused) {
    audio.play();
    isPlaying = true;
  } else {
    audio.pause();
    isPlaying = false;
  }
  updatePlayerUI();
  renderTracks();
}

function updatePlayerUI() {
  const icon = document.getElementById("playIcon");
  icon.innerHTML = isPlaying
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ":" + String(sec).padStart(2, "0");
}

audio.addEventListener("timeupdate", () => {
  const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  progressBar.style.width = p + "%";
  document.getElementById("curTime").textContent = fmt(audio.currentTime);
  document.getElementById("durTime").textContent = fmt(audio.duration);
});
audio.addEventListener("ended", () => {
  if (currentIndex < TRACKS.length - 1) playTrack(currentIndex + 1);
  else { isPlaying = false; updatePlayerUI(); renderTracks(); }
});
audio.addEventListener("play", () => { isPlaying = true; updatePlayerUI(); });
audio.addEventListener("pause", () => { isPlaying = false; updatePlayerUI(); });

progressWrap.addEventListener("click", e => {
  if (!audio.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audio.currentTime = ratio * audio.duration;
});

document.getElementById("playBtn").addEventListener("click", togglePlay);
document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentIndex > 0) playTrack(currentIndex - 1);
  else if (currentIndex === 0) { audio.currentTime = 0; audio.play(); }
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentIndex < TRACKS.length - 1) playTrack(currentIndex + 1);
});

// Spacebar
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
    togglePlay();
  }
});

// Toast
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// Install / PWA
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});
document.getElementById("doInstall").addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installBanner").classList.remove("show");
    if (outcome === "accepted") toast("Установлено!");
  } else {
    // iOS / fallback
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    toast(isIOS
      ? "Поделиться → На экран «Домой»"
      : "Меню браузера → Установить приложение");
  }
});
document.getElementById("closeInstall").addEventListener("click", () => {
  document.getElementById("installBanner").classList.remove("show");
});
document.getElementById("installBtn").addEventListener("click", () => {
  document.getElementById("installBanner").classList.add("show");
});

// Telegram WebApp expand
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
  document.documentElement.style.setProperty("--safe-t", window.Telegram.WebApp.contentSafeAreaInset?.top + "px" || "0px");
}

// Init
renderTracks();
renderSuno();
renderClips();
</script>
</body>
</html>
